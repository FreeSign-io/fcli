# golangci-lint v2 config
version: "2"

linters:
  default: standard
  exclusions:
    rules:
      # `defer foo.Close()` on Read-only resources is the idiomatic Go pattern
      # even though Close can technically return an error. Don't lint it.
      - linters:
          - errcheck
        source: '^\s*defer .*\.Close\(\)$'
      # Same for `_ = something.Close()` patterns we already handle.
      - path: '_test\.go$'
        linters:
          - errcheck

run:
  timeout: 5m
